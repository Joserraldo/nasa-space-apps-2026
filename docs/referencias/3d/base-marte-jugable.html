<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: juego a pantalla completa; HUD tipo consola de misión infantil en las esquinas. Look único oscuro sobre escena cálida. */
:root{
  --hud:#141a2b;        /* fondo de paneles del HUD */
  --hud-edge:#2c3550;   /* borde de paneles */
  --ink:#f4f1ea;        /* texto */
  --dim:#aab2c8;        /* texto secundario */
  --power:#f2b531;      /* energía */
  --life:#9be15d;       /* soporte vital, también botón principal */
  --shield:#5fd0f0;     /* blindaje */
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:#1a0f0b;color:var(--ink)}
body{margin:0;font-family:var(--f-body);overflow:hidden}
.game{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
.game canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{background:color-mix(in srgb,var(--hud) 92%,transparent);border:1px solid var(--hud-edge);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--hud) 94%,transparent);border-bottom:1px solid var(--hud-edge)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;padding-right:14px;border-right:1px solid var(--hud-edge)}
.logo svg{width:26px;height:26px}
.pills{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.pill{display:flex;align-items:center;gap:8px;border:2px solid;border-radius:10px;padding:4px 12px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em}
.pill b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);min-width:2ch;text-align:right}
.pill svg{width:18px;height:18px}
.pill.p{border-color:var(--power);color:var(--power)} .pill.l{border-color:var(--life);color:var(--life)} .pill.s{border-color:var(--shield);color:var(--shield)}
.pill span{color:var(--ink)}
.pill.bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.12)}}
.tools{display:flex;gap:8px}
button{font-family:var(--f-display);font-weight:600;color:var(--ink);background:#20283d;border:1px solid var(--hud-edge);border-radius:10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--life);outline-offset:2px}
.tool{height:36px;min-width:36px;padding:0 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.obj{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:76px;display:flex;gap:12px;align-items:center;padding:10px 16px 10px 12px}
.obj .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--life)}
.obj b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.03em}
.obj span{font-size:14px;color:var(--dim)}
.talk{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));padding:12px;display:grid;gap:12px}
.talk .say{display:flex;gap:12px;align-items:center}
.talk canvas{width:72px;height:56px;flex:none;cursor:default}
.talk p{margin:0;font-size:16px;line-height:1.35;padding-left:12px;border-left:1px solid var(--hud-edge);min-height:2.7em;display:flex;align-items:center}
.cta{background:var(--life);color:#14240a;border:0;font-size:20px;font-weight:700;letter-spacing:.03em;padding:12px;border-radius:12px}
.cta:disabled{opacity:.6;cursor:default}
.cta.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--life) 35%,transparent)}}
.hints{position:absolute;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.hint{display:flex;align-items:center;gap:10px;padding:8px 14px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;background:color-mix(in srgb,var(--hud) 92%,transparent);border:1px solid var(--hud-edge);border-radius:12px;color:var(--ink)}
.key{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 5px;border-radius:6px;background:var(--ink);color:var(--hud);font-weight:700;font-size:14px}
.hint.ready{border-color:var(--life);color:var(--life)}
.tag{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));font-family:var(--f-display);font-size:11px;letter-spacing:.1em;padding:6px 12px;border-radius:20px;background:color-mix(in srgb,var(--hud) 80%,transparent);color:var(--dim)}
.joy{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:2px solid rgba(255,255,255,.5);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;border-radius:50%;background:rgba(255,255,255,.7)}
.paused{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;background:rgba(10,12,22,.55);font-family:var(--f-display)}
.paused b{font-size:40px;letter-spacing:.08em}
[hidden]{display:none!important}
@media (max-width:1120px){
  .tag{display:none}
  .hints{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none}
}
@media (max-width:760px){
  .logo{font-size:18px;border-right:0;padding-right:0}
  .pill{font-size:0;gap:5px;padding:3px 8px} .pill b{font-size:17px}
  .obj{top:110px} .hints .hint.move{display:none} .tag{display:none}
  .hints{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 150px)}
}
@media (prefers-reduced-motion:reduce){.cta.ready,.pill.bump{animation:none}}
</style>

    <button class="cta" id="cta"></button>
  </div>

  <div class="hints">

    <button class="hint" id="eBtn"><span class="key">E</span><span data-i18n="interact">INTERACT</span></button>
  </div>
  <div class="tag" data-i18n="tag">TEST BUILD · 100% CODE · 0 3D FILES</div>
  <div class="joy" id="joy" hidden><i id="joyK"></i></div>

</div>

const circles=[{x:9,z:-5,r:3.85},{x:0,z:-5.4,r:.9},{x:4.6,z:-7.2,r:.8},{x:-4.8,z:-1.4,r:.65},{x:-10.5,z:2.2,r:.7},{x:13,z:-.5,r:.7},{x:12.4,z:.6,r:.7}];

function resolve(p,r){
 for(const c of circles){const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+r;if(d<m&&d>1e-4){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m}}
 const hx=THREE.MathUtils.clamp(p.x,-3.7,3.7),dx=p.x-hx,dz=p.z+8,d=Math.hypot(dx,dz),m=1.95+r;if(d<m&&d>1e-4){p.x=hx+dx/d*m;p.z=-8+dz/d*m}

function renderUI(){

 if(k==='KeyE'||k==='Enter'){if(!e.repeat)interact();return}if(k==='KeyP'||k==='Escape'){setPause(!paused);return}keys.add(k)});

const joy={x:0,z:0,id:null,sx:0,sy:0};const joyEl=$('joy'),joyK=$('joyK');

 joyEl.style.left=(e.clientX-r.left)+'px';joyEl.style.top=(e.clientY-r.top)+'px';joyEl.hidden=false;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=(e.clientX-joy.sx)/45,dy=(e.clientY-joy.sy)/45;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}

const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.z=0;joyEl.hidden=true;joyK.style.transform=''};

const lerpAng=(a,b,k)=>{const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k};
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),tmp=new THREE.Vector3(),OFF=new THREE.Vector3(0,4.6,8.2);
camPos.copy(player.position).add(OFF);camera.position.copy(camPos);camLook.copy(player.position).setY(1.1);
let phase=0,walkW=0,iphase=0,blinkT=2,clock=new THREE.Clock(),uiT=0;

function tick(){
 requestAnimationFrame(tick);
 const dt=Math.min(clock.getDelta(),.05);const time=clock.elapsedTime;
 if(paused){renderer.render(scene,camera);return}
 // --- jugador
 let ix=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+joy.x;
 let iz=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0)+joy.z;
 const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il}
 const moving=il>.08;const sp=4.3;
 if(moving){player.position.x+=ix*sp*dt;player.position.z+=iz*sp*dt;player.rotation.y=lerpAng(player.rotation.y,Math.atan2(ix,iz),1-Math.exp(-dt*12))}
 resolve(player.position,.38);
 {const dx=player.position.x-iris.position.x,dz=player.position.z-iris.position.z,d=Math.hypot(dx,dz);if(d<1.05&&d>1e-4){player.position.x=iris.position.x+dx/d*1.05;player.position.z=iris.position.z+dz/d*1.05}}
 walkW=THREE.MathUtils.lerp(walkW,moving?Math.min(1,il):0,1-Math.exp(-dt*10));phase+=dt*11*walkW;
 const sw=Math.sin(phase)*walkW;
 legL.rotation.x=sw*.75;legR.rotation.x=-sw*.75;armL.rotation.x=-sw*.65;armR.rotation.x=sw*.65;
 prig.position.y=Math.abs(Math.sin(phase))*.07*walkW+Math.sin(time*2)*.012*(1-walkW);
 prig.rotation.x=walkW*.08;phead.rotation.y=Math.sin(time*.7)*.15*(1-walkW);
 // --- IRIS
 const s=STAGES[stage];
 if(irisLead&&s.at){tmp.copy(s.at).add(new THREE.Vector3(1.6,0,.8))}
 else{const a=player.rotation.y;tmp.set(player.position.x+Math.cos(a)*1.5+Math.sin(a)*-.6,0,player.position.z-Math.sin(a)*1.5+Math.cos(a)*-.6)}
 const idx=tmp.x-iris.position.x,idz=tmp.z-iris.position.z,id=Math.hypot(idx,idz);let ispd=0;
 if(id>.4){ispd=Math.min(irisLead?3.2:4.6,id*2.4);iris.position.x+=idx/id*ispd*dt;iris.position.z+=idz/id*ispd*dt;iris.rotation.y=lerpAng(iris.rotation.y,Math.atan2(idx,idz),1-Math.exp(-dt*7))}
 else iris.rotation.y=lerpAng(iris.rotation.y,Math.atan2(player.position.x-iris.position.x,player.position.z-iris.position.z),1-Math.exp(-dt*4));
 resolve(iris.position,.5);
 wheels.forEach(w=>w.rotation.x+=ispd*dt/.27);
 iphase+=dt;irig.position.y=Math.sin(iphase*3)*.03;irig.rotation.x=THREE.MathUtils.lerp(irig.rotation.x,ispd*.04,.1);
 ihead.rotation.z=Math.sin(iphase*1.3)*.06;
 pointT=Math.max(0,pointT-dt);const pointing=irisLead||near||pointT>0;
 iarmR.rotation.x=THREE.MathUtils.lerp(iarmR.rotation.x,pointing?-1.9:Math.sin(iphase*2)*.15,1-Math.exp(-dt*8));
 iarmL.rotation.x=Math.sin(iphase*2+1)*.15;
 blinkT-=dt;if(blinkT<0){faceMat.map=faceBlink;if(blinkT<-.12){faceMat.map=faceOpen;blinkT=2+rnd()*3}}
 // --- objetivo
 const wasNear=near;near=!!(s.at&&Math.hypot(player.position.x-s.at.x,player.position.z-s.at.z)<s.r);
 if(near&&irisLead)irisLead=false;
 if(near!==wasNear)renderUI();
 marker.visible=!!s.mk;if(s.mk){marker.position.copy(s.mk);marker.position.y+=Math.sin(time*3)*.15;marker.rotation.y=time*1.5}
 // --- efectos
 if(cleanFx>0){cleanFx=Math.max(0,cleanFx-dt*.6);dusts.forEach(d=>d.material.opacity=.55*cleanFx);cellsMat.emissiveIntensity=Math.sin(cleanFx*Math.PI)*.8}
 if(growFx>0){growFx=Math.max(0,growFx-dt*.7);plants.forEach((p,i)=>p.scale.setScalar(1+Math.sin(Math.min(1,(1-growFx)*1.6-i*.04)*Math.PI)*.35*(growFx>0?1:0)))}
 // --- stats
 uiT+=dt;for(const k in stats){shown[k]+=(stats[k]-shown[k])*Math.min(1,dt*3)}

 // --- cámara
 camPos.lerp(tmp.copy(player.position).add(OFF),1-Math.exp(-dt*4));camera.position.copy(camPos);
 camLook.lerp(tmp.copy(player.position).setY(1.1).add(new THREE.Vector3(0,0,-1.2)),1-Math.exp(-dt*6));camera.lookAt(camLook);
 sun.position.set(player.position.x+14,22,player.position.z+12);sun.target.position.copy(player.position);
 renderer.render(scene,camera)}
