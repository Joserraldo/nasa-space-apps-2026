name: CI

on:
  pull_request:
    branches: [develop, main, feat/ui-escenarios]
  push:
    branches: [develop, main, feat/ui-escenarios]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

  e2e:
    name: E2E ruta dorada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Solo Chromium (el único proyecto de playwright.config.ts), con su caché por versión.
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache-pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}

      - name: Instalar Chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependencias del sistema para Chromium
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Sin E2E_BASE_URL, playwright.config.ts levanta el servidor de Vite de ui/.
      # Un trabajador: sin GPU la escena 3D se dibuja en la CPU, y dos recorridos largos a la vez (ruta dorada y
      # "Play again") se quitaban tiempo y caían en puntos distintos según la carga del equipo (#406).
      - name: E2E (ruta dorada contra Vite)
        run: npm run e2e -- --workers=1

      - name: Reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
