name: Despliegue (Cloudflare Workers)
# Cada merge a develop publica la PREVIEW (Worker nasa-space-apps-2026-preview).
# Cada merge a main publica PRODUCCIÓN (Worker nasa-space-apps-2026).
# Solo se publica si pasan tipos y pruebas. Sin los secretos CLOUDFLARE_API_TOKEN y
# CLOUDFLARE_ACCOUNT_ID el job se salta (no falla). Basado en el #78 de José.
# Si existe el secreto BAI_API_KEY en GitHub, se copia al Worker después de publicar
# (así la clave de la IA no depende de que alguien corra `wrangler secret put` a mano).
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
    steps:
      - name: ¿Hay secretos de Cloudflare?
        id: hay
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.hay.outputs.ok == 'true'
        uses: actions/checkout@v4

      - if: steps.hay.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - if: steps.hay.outputs.ok == 'true'
        run: npm ci

      - name: Tipos y pruebas (si fallan, no se publica)
        if: steps.hay.outputs.ok == 'true'
        run: npm run typecheck && npm test

      - name: Construir la pantalla
        if: steps.hay.outputs.ok == 'true'
        run: npm run build

      - name: Publicar preview (develop)
        if: steps.hay.outputs.ok == 'true' && github.ref_name == 'develop'
        working-directory: infra/worker
        run: npx --yes wrangler@4 deploy --env preview

      - name: Publicar producción (main)
        if: steps.hay.outputs.ok == 'true' && github.ref_name == 'main'
        working-directory: infra/worker
        run: npx --yes wrangler@4 deploy --env=""

      # La clave va por stdin: nunca aparece en el comando ni en el log (GitHub la enmascara igual).
      - name: Clave de la IA al Worker de preview
        if: steps.hay.outputs.ok == true && github.ref_name == develop && env.BAI_API_KEY != 
        working-directory: infra/worker
        run: printf %s "$BAI_API_KEY" | npx --yes wrangler@4 secret put BAI_API_KEY --env preview

      - name: Clave de la IA al Worker de producción
        if: steps.hay.outputs.ok == true && github.ref_name == main && env.BAI_API_KEY != 
        working-directory: infra/worker
        run: printf %s "$BAI_API_KEY" | npx --yes wrangler@4 secret put BAI_API_KEY --env=""
