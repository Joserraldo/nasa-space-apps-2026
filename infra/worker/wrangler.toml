# Worker del clasificador (rol infra). Desplegar: npx wrangler deploy (desde infra/worker)
# La clave NUNCA va aquí: npx wrangler secret put BAI_API_KEY
name = "solar-shield-clasificar"
main = "src/clasificar.ts"
compatibility_date = "2026-11-01"

[vars]
BAI_BASE_URL = "https://api.b.ai/v1"
BAI_MODEL = "qwen3.8-flash"

# Límite por IP (crear con: npx wrangler kv namespace create LIMITE y pegar el id)
# [[kv_namespaces]]
# binding = "LIMITE"
# id = "<id del namespace>"
